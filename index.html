<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Laspa</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for parsing JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase v9 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* 
      ================================================
      Apple Native "Inset Grouped" Aesthetic
      ================================================
    */
    :root {
      --bg-color: #F2F2F7;
      --text-color: #000000;
      --text-secondary: #8E8E93;
      --card-bg: #FFFFFF;
      --accent-color: #007AFF;
      --divider: #C6C6C8;
      --destructive: #FF3B30;
      --success: #34C759;
      --warning: #FF9500;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --text-color: #FFFFFF;
        --text-secondary: #8E8E93;
        --card-bg: #1C1C1E;
        --accent-color: #0A84FF;
        --divider: #38383A;
        --destructive: #FF453A;
        --success: #32D74B;
        --warning: #FF9F0A;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      background: var(--bg-color);
      z-index: 10;
    }
    
    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    
    .header-large-title {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      padding: 0 20px 10px 20px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--accent-color);
      font-size: 1.05rem;
      cursor: pointer;
      font-weight: 400;
      padding: 4px 0;
      position: relative;
      z-index: 11;
    }
    .nav-btn.bold { font-weight: 600; }
    .nav-btn:active { opacity: 0.6; }
    .nav-btn:disabled { color: var(--text-secondary); opacity: 0.5; cursor: not-allowed; }

    .content-area {
      padding: 0 20px 40px 20px;
      flex-grow: 1;
      overflow-y: auto;
    }

    /* iOS Grouped List */
    .ios-group-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
      margin-left: 16px;
      margin-top: 24px;
      font-weight: 500;
    }
    .ios-group {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .ios-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--divider);
      transition: background-color 0.2s;
    }
    .ios-row:last-child {
      border-bottom: none;
    }
    .ios-row.clickable {
      cursor: pointer;
    }
    .ios-row.clickable:active {
      background-color: rgba(142, 142, 147, 0.15);
    }
    
    .chevron-right {
      color: var(--text-secondary);
      font-size: 1.2rem;
      opacity: 0.5;
    }

    .delete-icon {
      color: var(--destructive);
      font-size: 1.4rem;
      margin-right: 12px;
      cursor: pointer;
    }
    
    .edit-icon {
      color: var(--accent-color);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Progress Bar (Inline) */
    .progress-bar-inline {
      height: 4px;
      background: var(--divider);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
      width: 100%;
    }
    .progress-fill-inline {
      height: 100%;
      background: var(--accent-color);
      border-radius: 2px;
    }

    /* Inputs */
    .ios-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.05rem;
      padding: 4px 0;
      outline: none;
    }
    .ios-input::placeholder {
      color: var(--text-secondary);
    }

    /* Flashcard (Study View) */
    .card-container {
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-top: 20px;
      margin-bottom: 30px;
      user-select: none;
      height: 340px;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      font-size: 1.6rem;
      font-weight: 500;
      text-align: center;
      word-break: break-word;
      overflow-y: auto;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    .card-label {
      position: absolute;
      top: 20px;
      left: 24px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .score-badge {
      position: absolute;
      bottom: 20px;
      right: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .control-btn {
      flex: 1;
      padding: 16px 10px;
      background: var(--card-bg);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background-color 0.2s;
    }
    .control-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .control-btn:not(:disabled):active {
      background-color: rgba(142, 142, 147, 0.15);
    }
    .text-bad { color: var(--destructive); }
    .text-soso { color: var(--warning); }
    .text-perfect { color: var(--success); }

    .tag-sort-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 5px;
    }
    .tag-sort-btn:active {
      opacity: 0.5;
    }
    
    .check-icon {
      color: var(--accent-color);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // --- Firebase Initialization ---
    const firebaseConfig = {
      apiKey: "AIzaSyBoMhyiBaGB--GI3Q01d2t2aNuTHxFFhbk",
      authDomain: "laspa-bada3.firebaseapp.com",
      projectId: "laspa-bada3",
      storageBucket: "laspa-bada3.firebasestorage.app",
      messagingSenderId: "62622439446",
      appId: "1:62622439446:web:9edd1cca2409d93c23bd37",
      databaseURL: "https://laspa-bada3-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    // --- Default Data ---
    const defaultDecks = [
      {
        id: 'deck-1',
        title: '生物の基礎用語',
        tagOrder: ['細胞', '遺伝'],
        questions: [
          { id: 1, question: "ミトコンドリアの主な働きは？", answer: "細胞呼吸の場であり、ATPを産生する", tags: "細胞" },
          { id: 2, question: "光合成が行われる細胞小器官は？", answer: "葉緑体", tags: "細胞" },
          { id: 3, question: "DNAの構成単位を何と呼ぶ？", answer: "ヌクレオチド", tags: "遺伝" },
          { id: 4, question: "減数分裂において相同染色体が対合してできるものは？", answer: "二価染色体", tags: "遺伝" },
          { id: 5, question: "セントラルドグマにおける情報の流れは？", answer: "DNA → RNA → タンパク質", tags: "遺伝" },
        ]
      },
      {
        id: 'deck-2',
        title: '必須英単語',
        tagOrder: ['動詞', '形容詞'],
        questions: [
          { id: 1, question: "abandon", answer: "見捨てる、放棄する", tags: "動詞" },
          { id: 2, question: "capable", answer: "能力がある", tags: "形容詞" },
          { id: 3, question: "crucial", answer: "極めて重要な", tags: "形容詞" },
          { id: 4, question: "inevitable", answer: "避けられない", tags: "形容詞" },
          { id: 5, question: "sustain", answer: "維持する", tags: "動詞" },
        ]
      }
    ];

    const MODE_CONFIGS = {
      '60': { targetScore: 2, label: '60点狙い (1回正解)' },
      '80': { targetScore: 4, label: '80点狙い (2回正解)' },
      '100': { targetScore: 6, label: '100点狙い (3回正解)' }
    };
    const DEFAULT_TIME_MS = 12 * 60 * 60 * 1000;
    const STORAGE_KEY_DECKS = 'cramming-flashcards-decks-v2';
    const STORAGE_KEY_ALL_PROGRESS = 'cramming-flashcards-all-progress-v2';

    // --- Sub Components ---
    function StudyHeader({ title, remainingCards, progressPercent, initialTimeLeft, onTimeUpdate, onQuit }) {
      const [timeLeft, setTimeLeft] = useState(initialTimeLeft);
      useEffect(() => { setTimeLeft(initialTimeLeft); }, [initialTimeLeft]);
      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 0) return 0;
            const newTime = prev - 1000;
            onTimeUpdate(newTime);
            return newTime;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [onTimeUpdate]);

      const formatTime = (ms) => {
        if (ms <= 0) return "00:00:00";
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      };

      return (
        <div className="header-bar" style={{ position: 'relative' }}>
          <button className="nav-btn" onClick={onQuit}>〈 戻る</button>
          <div className="header-title" style={{textAlign: 'center', width: '50%'}}>
            <div style={{fontSize: '0.8rem', color: 'var(--text-secondary)'}}>{title}</div>
            <div style={{fontSize: '0.95rem'}}>{formatTime(timeLeft)} • 残り約{remainingCards}枚</div>
          </div>
          <div style={{width: '60px'}}></div>
          {progressPercent !== undefined && (
            <div style={{
              position: 'absolute', bottom: 0, left: 0, height: '4px',
              background: 'var(--success)', width: `${progressPercent}%`, transition: 'width 0.3s ease-out'
            }} />
          )}
        </div>
      );
    }

    function App() {
      // Firebase Auth State
      const [authUser, setAuthUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      // Data State
      const [decks, setDecks] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_DECKS);
        return saved ? JSON.parse(saved) : defaultDecks;
      });
      const [allProgress, setAllProgress] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_ALL_PROGRESS);
        return saved ? JSON.parse(saved) : {};
      });

      // App State
      const [view, setView] = useState('library'); 
      const [isLibraryEditing, setIsLibraryEditing] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      
      // Study State
      const [activeDeckId, setActiveDeckId] = useState(null);
      const [studyMode, setStudyMode] = useState(null);
      const [queue, setQueue] = useState([]);
      const [isFlipped, setIsFlipped] = useState(false);
      const [initialTotal, setInitialTotal] = useState(0);
      const [timeLeft, setTimeLeft] = useState(DEFAULT_TIME_MS);
      const [selectedTag, setSelectedTag] = useState(null);
      const [isReorderingTags, setIsReorderingTags] = useState(false);

      // Edit State
      const [editDeckData, setEditDeckData] = useState(null);
      const fileInputRef = useRef(null);
      const appendCsvInputRef = useRef(null);

      // Auth Forms
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');

      // --- Firebase Auth & Sync (Realtime Database) ---
      useEffect(() => {
        let dbRef = null;
        const unsubscribeAuth = auth.onAuthStateChanged(user => {
          setAuthUser(user);
          if (user) {
            dbRef = db.ref('users/' + user.uid);
            dbRef.on('value', snapshot => {
              const data = snapshot.val();
              if (data) {
                if (data.decks) setDecks(data.decks);
                if (data.allProgress) setAllProgress(data.allProgress);
              }
            }, (error) => {
              console.error("Realtime DB Error:", error);
            });
          } else {
            if (dbRef) dbRef.off();
          }
          setAuthLoading(false);
        });
        return () => {
          unsubscribeAuth();
          if (dbRef) dbRef.off();
        };
      }, []);

      const syncToCloud = async (newDecks, newProgress) => {
        if (!authUser) return;
        setIsSyncing(true);
        try {
          await db.ref('users/' + authUser.uid).update({
            decks: newDecks || decks,
            allProgress: newProgress || allProgress,
            updatedAt: firebase.database.ServerValue.TIMESTAMP
          });
          setIsSyncing(false);
          return true;
        } catch (e) {
          console.error("Cloud Sync Error:", e);
          setIsSyncing(false);
          throw e;
        }
      };

      // Local Storage Backup
      useEffect(() => { localStorage.setItem(STORAGE_KEY_DECKS, JSON.stringify(decks)); }, [decks]);
      useEffect(() => { localStorage.setItem(STORAGE_KEY_ALL_PROGRESS, JSON.stringify(allProgress)); }, [allProgress]);

      // Helper to migrate and get current scores
      const getCurrentScores = useCallback((deckId) => {
        const prog = allProgress[deckId];
        if (!prog) return {};
        if (prog.scores) return prog.scores;
        
        // Migrate old queue to scores
        const deck = decks.find(d => d.id === deckId);
        if (!deck) return {};
        const inferredScores = {};
        const qArray = prog.queue || [];
        const targetScore = prog.studyMode ? MODE_CONFIGS[prog.studyMode].targetScore : 2;
        
        deck.questions.forEach(q => {
          const inQueue = qArray.find(x => x.id === q.id);
          if (inQueue) {
            inferredScores[q.id] = inQueue.score || 0;
          } else {
            inferredScores[q.id] = targetScore; // Assume completed
          }
        });
        return inferredScores;
      }, [allProgress, decks]);

      // Track active study progress locally
      useEffect(() => {
        if (activeDeckId && (view === 'study' || view === 'complete')) {
          setAllProgress(prev => {
            const prog = prev[activeDeckId] || {};
            const oldScores = prog.scores || getCurrentScores(activeDeckId);
            const newScores = { ...oldScores };
            queue.forEach(q => { newScores[q.id] = q.score; });
            return {
              ...prev,
              [activeDeckId]: { queue, initialTotal, studyMode, timeLeft, scores: newScores }
            };
          });
        }
      }, [view, queue, activeDeckId, initialTotal, studyMode, timeLeft]);


      // --- Auth Handlers ---
      const handleLogin = async () => {
        try {
          await auth.signInWithEmailAndPassword(authEmail, authPassword);
          setView('library');
          setAuthEmail(''); setAuthPassword('');
        } catch (e) {
          alert('ログイン失敗: ' + e.message);
        }
      };

      const handleRegister = async () => {
        try {
          const cred = await auth.createUserWithEmailAndPassword(authEmail, authPassword);
          await db.ref('users/' + cred.user.uid).set({
            decks: decks,
            allProgress: allProgress,
            updatedAt: firebase.database.ServerValue.TIMESTAMP
          });
          setView('library');
          setAuthEmail(''); setAuthPassword('');
        } catch (e) {
          alert('登録失敗: ' + e.message);
        }
      };


      // --- Navigation & Core Handlers ---
      const handleStartDeck = (deckId) => {
        if (isLibraryEditing) return;
        setActiveDeckId(deckId);
        setSelectedTag(null);
        setIsReorderingTags(false);
        setView('mode');
      };

      const handleSelectMode = (mode) => {
        const deck = decks.find(d => d.id === activeDeckId);
        if (!deck || deck.questions.length === 0) {
          alert("カードがありません。"); return;
        }
        let filteredQuestions = deck.questions;
        if (selectedTag) {
          filteredQuestions = deck.questions.filter(q => {
            if (!q.tags) return false;
            return q.tags.split(',').map(t => t.trim()).includes(selectedTag);
          });
        }
        if (filteredQuestions.length === 0) {
          alert("該当するカードがありません。"); return;
        }

        const currentScores = getCurrentScores(activeDeckId);
        setStudyMode(mode);
        const targetScore = MODE_CONFIGS[mode].targetScore;
        
        const remaining = filteredQuestions.filter(q => (currentScores[q.id] || 0) < targetScore);
        if (remaining.length === 0) {
          alert("この範囲はすでに目標を達成しています！"); return;
        }

        const shuffledQueue = remaining.map(q => ({...q, score: currentScores[q.id] || 0, _uid: Math.random()})).sort(() => Math.random() - 0.5);
        setQueue(shuffledQueue);
        setInitialTotal(filteredQuestions.length);
        setTimeLeft(allProgress[activeDeckId]?.timeLeft || DEFAULT_TIME_MS);
        setIsFlipped(false);
        setView('study');
      };

      const handleJudge = useCallback((result) => {
        if (!isFlipped || queue.length === 0) return;
        setIsFlipped(false);
        
        const currentCard = { ...queue[0] };
        const targetScore = MODE_CONFIGS[studyMode].targetScore;
        
        if (result === 'perfect') currentCard.score += 2;
        else if (result === 'soso') currentCard.score += 1;
        else if (result === 'bad') currentCard.score -= 2;

        const prog = allProgress[activeDeckId] || {};
        const currentScoresObj = prog.scores || getCurrentScores(activeDeckId);
        const updatedScores = { ...currentScoresObj, [currentCard.id]: currentCard.score };
        
        setAllProgress({
          ...allProgress,
          [activeDeckId]: { ...prog, scores: updatedScores }
        });

        setTimeout(() => {
          setQueue(prevQueue => {
            if (prevQueue.length === 0) return prevQueue;
            const card = { ...prevQueue[0] }; 
            card.score = currentCard.score;
            const newQueue = [...prevQueue].slice(1);

            if (card.score >= targetScore) {
              if (newQueue.length === 0) {
                setView('complete');
                if (authUser) {
                  syncToCloud(null, {...allProgress, [activeDeckId]: { ...prog, queue: [], initialTotal, studyMode, timeLeft, scores: updatedScores }});
                }
              }
              return newQueue;
            }

            let interval = 0;
            if (result === 'bad') interval = Math.floor(Math.random() * 3) + 2;
            else if (result === 'soso') interval = Math.floor(Math.random() * 5) + 5;
            else if (result === 'perfect') interval = Math.floor(Math.random() * 10) + 10;
            
            interval = Math.min(interval, newQueue.length);
            if (interval === 0 && newQueue.length > 0) interval = 1;

            card._uid = Math.random();
            newQueue.splice(interval, 0, card);
            return newQueue;
          });
        }, 200);
      }, [isFlipped, queue, studyMode, authUser, allProgress, activeDeckId, initialTotal, timeLeft, getCurrentScores]);

      const quitStudy = () => {
        const prog = allProgress[activeDeckId] || {};
        if (authUser) syncToCloud(null, {...allProgress, [activeDeckId]: { ...prog, queue, initialTotal, studyMode, timeLeft }});
        setView('library');
      };

      const handleMoveTag = (tag, direction) => {
        const currentDeck = decks.find(d => d.id === activeDeckId);
        if (!currentDeck) return;
        
        const allSet = new Set();
        currentDeck.questions.forEach(q => {
          if (q.tags) q.tags.split(',').forEach(t => { if(t.trim()) allSet.add(t.trim()); });
        });
        
        let order = currentDeck.tagOrder ? [...currentDeck.tagOrder].filter(t => allSet.has(t)) : [];
        Array.from(allSet).forEach(t => { if (!order.includes(t)) order.push(t); });

        const idx = order.indexOf(tag);
        if (direction === 'up' && idx > 0) {
          [order[idx - 1], order[idx]] = [order[idx], order[idx - 1]];
        } else if (direction === 'down' && idx < order.length - 1) {
          [order[idx + 1], order[idx]] = [order[idx], order[idx + 1]];
        }

        const newDeck = { ...currentDeck, tagOrder: order };
        const newDecks = decks.map(d => d.id === currentDeck.id ? newDeck : d);
        setDecks(newDecks);
        syncToCloud(newDecks, null);
      };

      const parseCSVToQuestions = (text) => {
        const lines = text.split(/\r?\n/);
        const questions = [];
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (!line.trim()) continue;
          const row = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          if (row.length >= 2) {
            let q = row[0].replace(/^"|"$/g, '').trim();
            let a = row[1].replace(/^"|"$/g, '').trim();
            let tags = (row.length >= 3) ? row[2].replace(/^"|"$/g, '').trim() : '';
            if (i === 0 && (q.toLowerCase().includes('question') || q.includes('問題'))) continue;
            if (q && a) questions.push({ id: Date.now() + Math.random(), question: q, answer: a, tags: tags });
          }
        }
        return questions;
      };

      // --- Renders ---
      if (authLoading) {
        return <div className="app-container" style={{justifyContent: 'center', alignItems: 'center'}}>読み込み中...</div>;
      }

      if (view === 'help') {
        return (
          <div className="app-container">
            <div className="header-bar">
              <button className="nav-btn" onClick={() => setView('library')}>〈 戻る</button>
              <div className="header-title">使い方ガイド</div>
              <div style={{width: '60px'}}></div>
            </div>
            <div className="content-area">
              <div style={{textAlign: 'center', margin: '30px 0 20px 0'}}>
                <h2 style={{fontSize: '1.6rem', marginBottom: '8px', fontWeight: 700}}>Laspa へようこそ！</h2>
                <p style={{color: 'var(--text-secondary)', fontSize: '0.95rem', lineHeight: '1.5'}}>
                  一夜漬けに特化したスマート単語帳です。<br/>効率よく暗記するための使い方をご紹介します。
                </p>
              </div>

              <div className="ios-group-title">1. 単語帳の作り方</div>
              <div className="ios-group" style={{padding: '16px', fontSize: '0.95rem', lineHeight: '1.6', color: 'var(--text-color)'}}>
                ライブラリ画面の <strong style={{color: 'var(--accent-color)'}}>「新規作成」</strong> から、手入力で単語帳を作成できます。<br/><br/>
                パソコンで作成したExcelやスプレッドシートのデータを一気に読み込むには、画面左上の <strong style={{color: 'var(--accent-color)'}}>「読込」</strong> をタップし、保存したCSVファイルを選択してください。<br/>
                <span style={{fontSize: '0.85rem', color: 'var(--text-secondary)'}}>※CSVの形式は「A列：問題」「B列：答え」「C列：タグ」にしてください。</span>
              </div>

              <div className="ios-group-title">2. 効率よく暗記する（独自アルゴリズム）</div>
              <div className="ios-group" style={{padding: '16px', fontSize: '0.95rem', lineHeight: '1.6', color: 'var(--text-color)'}}>
                勉強したい単語帳を選ぶと、出題範囲（タグ）と目標モードを選べます。<br/><br/>
                学習画面ではカードをタップして答えを確認し、自分の記憶度に合わせて下の3つのボタンを押してください。<br/>
                ・<span style={{color: 'var(--destructive)', fontWeight: 600}}>全然ダメ</span>：すぐにまた出題されます。<br/>
                ・<span style={{color: 'var(--warning)', fontWeight: 600}}>もう少し</span>：少し後にもう一度出題されます。<br/>
                ・<span style={{color: 'var(--success)', fontWeight: 600}}>完璧</span>：しばらく出題されなくなります。<br/><br/>
                目標の定着度に達したカードはリストから消え、すべてのカードが消えれば学習完了です！
              </div>

              <div className="ios-group-title">3. 複数端末で同期する</div>
              <div className="ios-group" style={{padding: '16px', fontSize: '0.95rem', lineHeight: '1.6', color: 'var(--text-color)'}}>
                無料のアカウントを作成してサインインすると、単語帳データがクラウドに保存されます。<br/><br/>
                パソコンで単語帳を作り、電車の中ではスマホでログインして続きを勉強する…といった使い方が可能です。<br/>
                <span style={{fontSize: '0.85rem', color: 'var(--text-secondary)'}}>※通信状況などで同期がうまくいかない場合は、設定にある「データをクラウドに強制保存」ボタンをお試しください。</span>
              </div>
            </div>
          </div>
        );
      }

      if (view === 'login') {
        return (
          <div className="app-container">
            <div className="header-bar">
              <button className="nav-btn" onClick={() => setView('library')}>キャンセル</button>
              <div className="header-title">サインイン</div>
              <div style={{width: '60px'}}></div>
            </div>
            <div className="content-area">
              <div className="ios-group-title">メールアドレスとパスワード</div>
              <div className="ios-group">
                <div className="ios-row">
                  <input type="email" placeholder="メールアドレス" className="ios-input" value={authEmail} onChange={e => setAuthEmail(e.target.value)} />
                </div>
                <div className="ios-row">
                  <input type="password" placeholder="パスワード (6文字以上)" className="ios-input" value={authPassword} onChange={e => setAuthPassword(e.target.value)} />
                </div>
              </div>
              <div className="ios-group">
                <div className="ios-row clickable" onClick={handleLogin}>
                  <div style={{color: 'var(--accent-color)', fontWeight: 600, width: '100%', textAlign: 'center'}}>ログイン</div>
                </div>
              </div>
              <div className="ios-group">
                <div className="ios-row clickable" onClick={handleRegister}>
                  <div style={{color: 'var(--success)', fontWeight: 600, width: '100%', textAlign: 'center'}}>新規登録 (データをクラウドに移行)</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (view === 'library') {
        return (
          <div className="app-container">
            <div className="header-bar">
              <button className="nav-btn" onClick={() => {if(fileInputRef.current) fileInputRef.current.click()}}>読込</button>
              <div className="header-title">ライブラリ</div>
              <button className="nav-btn" onClick={() => setIsLibraryEditing(!isLibraryEditing)}>
                {isLibraryEditing ? '完了' : '編集'}
              </button>
            </div>
            <div className="header-large-title">
              Laspa <span style={{fontSize: '0.9rem', color: 'var(--text-secondary)', fontWeight: 400}}>3.0.3</span>
            </div>
            
            <div className="content-area">
              {decks.length === 0 ? (
                <div style={{textAlign: 'center', marginTop: '40px', color: 'var(--text-secondary)'}}>単語帳がありません</div>
              ) : (
                <div className="ios-group">
                  {decks.map(deck => {
                    const prog = allProgress[deck.id];
                    let percent = 0; let progressLabel = "未実施";
                    if (prog) {
                      const deckScores = getCurrentScores(deck.id);
                      const targetScore = prog.studyMode ? MODE_CONFIGS[prog.studyMode].targetScore : 2;
                      
                      const totalPoints = deck.questions.length * targetScore;
                      let earnedPoints = 0;
                      let completedCards = 0;
                      
                      deck.questions.forEach(q => {
                         const s = deckScores[q.id] || 0;
                         earnedPoints += Math.min(s, targetScore);
                         if (s >= targetScore) completedCards++;
                      });

                      if (totalPoints > 0) {
                        percent = Math.floor((earnedPoints / totalPoints) * 100);
                        const equivalentRemaining = Math.max(0, Math.ceil((totalPoints - earnedPoints) / targetScore));
                        if (equivalentRemaining === 0 && completedCards === deck.questions.length) progressLabel = "完了";
                        else progressLabel = `進捗 ${percent}% (残り約${equivalentRemaining}枚)`;
                      }
                    }

                    return (
                      <div key={deck.id} className={`ios-row ${!isLibraryEditing ? 'clickable' : ''}`} onClick={() => handleStartDeck(deck.id)}>
                        {isLibraryEditing && (
                          <div className="delete-icon" onClick={(e) => { 
                            e.stopPropagation(); 
                            if(window.confirm('削除しますか？')) { 
                              const newDecks = decks.filter(d => d.id !== deck.id);
                              setDecks(newDecks); 
                              syncToCloud(newDecks, null);
                            } 
                          }}>⊖</div>
                        )}
                        <div style={{flexGrow: 1}}>
                          <div style={{fontSize: '1.05rem', fontWeight: 500, color: 'var(--text-color)'}}>{deck.title}</div>
                          <div style={{fontSize: '0.85rem', color: 'var(--text-secondary)', marginTop: '2px'}}>
                            全{deck.questions.length}枚 • {progressLabel}
                          </div>
                          <div className="progress-bar-inline">
                            <div className="progress-fill-inline" style={{ width: `${percent}%`, background: percent === 100 ? 'var(--success)' : 'var(--accent-color)' }}></div>
                          </div>
                        </div>
                        {!isLibraryEditing ? (
                          <div className="chevron-right">›</div>
                        ) : (
                          <div className="edit-icon" onClick={(e) => { e.stopPropagation(); setEditDeckData(JSON.parse(JSON.stringify(deck))); setView('edit'); }}>✏️</div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
              
              <div className="ios-group">
                <div className="ios-row clickable" onClick={() => {
                  setEditDeckData({ id: 'deck-' + Date.now(), title: '', questions: [{ id: Date.now(), question: '', answer: '', tags: '' }] });
                  setView('edit');
                }}>
                  <div style={{color: 'var(--accent-color)', fontWeight: 500}}>新規作成</div>
                </div>
              </div>

              <div className="ios-group-title">サポート</div>
              <div className="ios-group">
                <div className="ios-row clickable" onClick={() => setView('help')}>
                  <div style={{color: 'var(--accent-color)', fontWeight: 500}}>📖 使い方ガイド</div>
                  <div className="chevron-right">›</div>
                </div>
              </div>

              <div className="ios-group-title">アカウント・同期設定</div>
              <div className="ios-group">
                {authUser ? (
                  <>
                    <div className="ios-row">
                      <div style={{color: 'var(--text-secondary)'}}>ログイン中: {authUser.email}</div>
                    </div>
                    <div className="ios-row clickable" onClick={async () => {
                      try {
                        await syncToCloud(decks, allProgress);
                        alert('現在の端末のデータをクラウドに保存（上書き）しました！\nこれで他の端末にも同期されます。');
                      } catch (e) {
                        alert('保存エラー: データベースの権限がないか、通信に失敗しました。詳細: ' + e.message);
                      }
                    }}>
                      <div style={{color: 'var(--accent-color)', fontWeight: 500}}>
                        {isSyncing ? '通信中...' : '⇧ データをクラウドに強制保存'}
                      </div>
                    </div>
                    <div className="ios-row clickable" onClick={async () => {
                      try {
                        setIsSyncing(true);
                        const snapshot = await db.ref('users/' + authUser.uid).once('value');
                        const data = snapshot.val();
                        if (data) {
                          if (data.decks) setDecks(data.decks);
                          if (data.allProgress) setAllProgress(data.allProgress);
                          alert('クラウドからデータを復元しました！');
                        } else {
                          alert('クラウドにデータがありません。先に「強制保存」を行ってください。');
                        }
                        setIsSyncing(false);
                      } catch (e) {
                        setIsSyncing(false);
                        alert("読み込みエラー: データベースの権限がないか、通信に失敗しました。詳細: " + e.message);
                      }
                    }}>
                      <div style={{color: 'var(--accent-color)', fontWeight: 500}}>
                        {isSyncing ? '通信中...' : '⇩ クラウドからデータを読み込む'}
                      </div>
                    </div>
                    <div className="ios-row clickable" onClick={() => auth.signOut()}>
                      <div style={{color: 'var(--destructive)', fontWeight: 500}}>サインアウト</div>
                    </div>
                  </>
                ) : (
                  <div className="ios-row clickable" onClick={() => setView('login')}>
                    <div style={{color: 'var(--accent-color)', fontWeight: 500}}>サインイン（クラウド同期を有効にする）</div>
                  </div>
                )}
              </div>
            </div>
            <input type="file" accept=".csv" style={{display: 'none'}} ref={fileInputRef} onChange={e => {
              const file = e.target.files[0]; if (!file) return;
              const reader = new FileReader();
              reader.onload = (event) => {
                const qs = parseCSVToQuestions(event.target.result);
                if (qs.length > 0) {
                  const newDecks = [...decks, { id: 'deck-csv-' + Date.now(), title: file.name.replace(/\.[^/.]+$/, ""), questions: qs }];
                  setDecks(newDecks);
                  syncToCloud(newDecks, null);
                }
                e.target.value = '';
              };
              reader.readAsText(file);
            }} />
          </div>
        );
      }

      if (view === 'edit' && editDeckData) {
        return (
          <div className="app-container">
            <div className="header-bar">
              <button className="nav-btn" onClick={() => setView('library')}>キャンセル</button>
              <div className="header-title">編集</div>
              <button className="nav-btn bold" onClick={() => {
                if (!editDeckData.title.trim()) { alert('タイトルを入力してください'); return; }
                const qs = editDeckData.questions.filter(q => q.question.trim() || q.answer.trim());
                
                let newDecks = [...decks];
                const idx = decks.findIndex(d => d.id === editDeckData.id);
                if (idx >= 0) { newDecks[idx] = {...editDeckData, questions: qs}; }
                else { newDecks.push({...editDeckData, questions: qs}); }
                
                setDecks(newDecks);
                syncToCloud(newDecks, null);
                setView('library');
              }}>完了</button>
            </div>
            
            <div className="content-area">
              <div className="ios-group-title">タイトル</div>
              <div className="ios-group">
                <div className="ios-row">
                  <input type="text" className="ios-input" placeholder="単語帳の名前" value={editDeckData.title} onChange={e => setEditDeckData({...editDeckData, title: e.target.value})} />
                </div>
              </div>

              <div className="ios-group-title">一括操作</div>
              <div className="ios-group">
                <div className="ios-row clickable" onClick={() => setEditDeckData({...editDeckData, questions: [...editDeckData.questions, { id: Date.now(), question: '', answer: '', tags: '' }]})}>
                  <div style={{color: 'var(--accent-color)'}}>新しいカードを追加</div>
                </div>
                <div className="ios-row clickable" onClick={() => {if(appendCsvInputRef.current) appendCsvInputRef.current.click()}}>
                  <div style={{color: 'var(--accent-color)'}}>CSVから追加</div>
                </div>
              </div>

              <div className="ios-group-title">カード一覧 ({editDeckData.questions.length}枚)</div>
              {editDeckData.questions.map((q, index) => (
                <div className="ios-group" key={q.id}>
                  <div className="ios-row" style={{paddingTop: '8px', paddingBottom: '8px'}}>
                    <input type="text" className="ios-input" placeholder="問題" value={q.question} onChange={e => { const n = [...editDeckData.questions]; n[index].question = e.target.value; setEditDeckData({...editDeckData, questions: n}); }} />
                  </div>
                  <div className="ios-row" style={{paddingTop: '8px', paddingBottom: '8px'}}>
                    <input type="text" className="ios-input" placeholder="答え" value={q.answer} onChange={e => { const n = [...editDeckData.questions]; n[index].answer = e.target.value; setEditDeckData({...editDeckData, questions: n}); }} />
                  </div>
                  <div className="ios-row" style={{paddingTop: '8px', paddingBottom: '8px'}}>
                    <input type="text" className="ios-input" placeholder="タグ (カンマ区切り)" value={q.tags || ''} onChange={e => { const n = [...editDeckData.questions]; n[index].tags = e.target.value; setEditDeckData({...editDeckData, questions: n}); }} />
                  </div>
                  <div className="ios-row clickable" onClick={() => { const n = [...editDeckData.questions]; n.splice(index, 1); setEditDeckData({...editDeckData, questions: n}); }}>
                    <div style={{color: 'var(--destructive)'}}>このカードを削除</div>
                  </div>
                </div>
              ))}
            </div>
            <input type="file" accept=".csv" style={{display: 'none'}} ref={appendCsvInputRef} onChange={e => {
              const file = e.target.files[0]; if (!file) return;
              const reader = new FileReader();
              reader.onload = (event) => {
                const qs = parseCSVToQuestions(event.target.result);
                if (qs.length > 0) setEditDeckData({...editDeckData, questions: [...editDeckData.questions, ...qs]});
                e.target.value = '';
              };
              reader.readAsText(file);
            }} />
          </div>
        );
      }

      if (view === 'mode') {
        const deck = decks.find(d => d.id === activeDeckId);
        const prog = allProgress[activeDeckId];
        const queueArray = prog ? (prog.queue || []) : [];
        const hasProgress = prog && queueArray.length > 0;
        
        const currentScores = getCurrentScores(activeDeckId);
        const targetScore = prog?.studyMode ? MODE_CONFIGS[prog.studyMode].targetScore : 2;

        // タグの抽出と並び替え
        const allSet = new Set();
        if (deck) { deck.questions.forEach(q => { if (q.tags) q.tags.split(',').forEach(t => { if(t.trim()) allSet.add(t.trim()); }); }); }
        let tagsArray = deck?.tagOrder ? [...deck.tagOrder].filter(t => allSet.has(t)) : [];
        Array.from(allSet).forEach(t => { if (!tagsArray.includes(t)) tagsArray.push(t); });

        // 円グラフ（学習状況）の計算
        const total = deck ? deck.questions.length : 0;
        const completed = deck ? deck.questions.filter(q => (currentScores[q.id] || 0) >= targetScore).length : 0;
        const learning = deck ? deck.questions.filter(q => { const s = currentScores[q.id] || 0; return s > 0 && s < targetScore; }).length : 0;
        const weak = total - completed - learning;
        const totalPoints = deck ? deck.questions.length * targetScore : 0;
        const earnedPoints = deck ? deck.questions.reduce((sum, q) => sum + Math.min(currentScores[q.id] || 0, targetScore), 0) : 0;
        const percent = totalPoints > 0 ? Math.floor((earnedPoints / totalPoints) * 100) : 0;
        const completedDeg = (percent / 100) * 360;

        return (
          <div className="app-container">
            <div className="header-bar">
              <button className="nav-btn" onClick={() => setView('library')}>〈 戻る</button>
              <div className="header-title" style={{maxWidth: '60%', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{deck?.title}</div>
              <div style={{width: '60px'}}></div>
            </div>

            <div className="content-area">
              <div className="ios-group-title">学習状況</div>
              <div className="ios-group" style={{padding: '24px 16px', display: 'flex', flexDirection: 'column', gap: '24px'}}>
                <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '30px'}}>
                  <div style={{
                    width: '110px', height: '110px', borderRadius: '50%',
                    background: `conic-gradient(var(--success) 0deg ${completedDeg}deg, var(--divider) ${completedDeg}deg 360deg)`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center'
                  }}>
                    <div style={{
                      width: '74px', height: '74px', borderRadius: '50%', backgroundColor: 'var(--card-bg)',
                      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center'
                    }}>
                      <span style={{fontSize: '1.4rem', fontWeight: 700}}>{percent}<span style={{fontSize: '0.8rem', fontWeight: 500}}>%</span></span>
                    </div>
                  </div>
                  <div style={{display: 'flex', flexDirection: 'column', gap: '10px', fontSize: '0.95rem', fontWeight: 500}}>
                    <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}><span style={{color: 'var(--success)'}}>●</span> 完了: {completed}</div>
                    <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}><span style={{color: 'var(--warning)'}}>●</span> 学習中: {learning}</div>
                    <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}><span style={{color: 'var(--divider)'}}>●</span> 未着手: {weak}</div>
                  </div>
                </div>
                
                {tagsArray.length > 0 && (
                  <div style={{display: 'flex', overflowX: 'auto', gap: '16px', padding: '16px 8px 8px 8px', borderTop: '1px solid var(--divider)', margin: '0 -8px'}}>
                    {tagsArray.map(tag => {
                       const qs = deck.questions.filter(q => q.tags && q.tags.split(',').map(t=>t.trim()).includes(tag));
                       const t = qs.length;
                       const tPoints = t * targetScore;
                       const ePoints = qs.reduce((sum, q) => sum + Math.min(currentScores[q.id] || 0, targetScore), 0);
                       const p = tPoints > 0 ? Math.floor((ePoints / tPoints) * 100) : 0;
                       const cDeg = (p / 100) * 360;
                       
                       return (
                         <div key={tag} style={{display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px', minWidth: '70px', flexShrink: 0}}>
                           <div style={{
                             width: '56px', height: '56px', borderRadius: '50%',
                             background: `conic-gradient(var(--success) 0deg ${cDeg}deg, var(--divider) ${cDeg}deg 360deg)`,
                             display: 'flex', alignItems: 'center', justifyContent: 'center'
                           }}>
                             <div style={{
                               width: '38px', height: '38px', borderRadius: '50%', backgroundColor: 'var(--card-bg)',
                               display: 'flex', alignItems: 'center', justifyContent: 'center'
                             }}>
                               <span style={{fontSize: '0.8rem', fontWeight: 700}}>{p}%</span>
                             </div>
                           </div>
                           <div style={{fontSize: '0.75rem', color: 'var(--text-color)', fontWeight: 600, textAlign: 'center', width: '70px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{tag}</div>
                         </div>
                       );
                    })}
                  </div>
                )}
              </div>

              {hasProgress && (
                <>
                  <div className="ios-group-title">再開</div>
                  <div className="ios-group">
                    <div className="ios-row clickable" onClick={() => {
                       setStudyMode(prog.studyMode); setQueue(queueArray); setInitialTotal(prog.initialTotal); setTimeLeft(prog.timeLeft); setIsFlipped(false); setView('study');
                    }}>
                      <div style={{color: 'var(--accent-color)', fontWeight: 500}}>
                        ▶️ 現在のタグ・目標で再開する (残り{queueArray.length}枚)
                      </div>
                    </div>
                  </div>
                </>
              )}
              
              {tagsArray.length > 0 && (
                <>
                  <div className="ios-group-title" style={{display: 'flex', justifyContent: 'space-between', paddingRight: '16px'}}>
                    <span>学習する範囲（タグ）</span>
                    <span style={{color: 'var(--accent-color)', textTransform: 'none', cursor: 'pointer'}} onClick={() => setIsReorderingTags(!isReorderingTags)}>
                      {isReorderingTags ? '完了' : '並び替え'}
                    </span>
                  </div>
                  <div className="ios-group">
                    {!isReorderingTags && (
                      <div className="ios-row clickable" onClick={() => setSelectedTag(null)}>
                        <div style={{color: 'var(--text-color)'}}>すべてのカード</div>
                        {selectedTag === null && <div className="check-icon">✓</div>}
                      </div>
                    )}
                    
                    {tagsArray.map((tag, index) => (
                      <div key={tag} className={`ios-row ${!isReorderingTags ? 'clickable' : ''}`} onClick={() => { if(!isReorderingTags) setSelectedTag(tag); }}>
                        <div style={{color: 'var(--text-color)'}}>{tag}</div>
                        
                        {!isReorderingTags ? (
                          selectedTag === tag && <div className="check-icon">✓</div>
                        ) : (
                          <div style={{display: 'flex', gap: '20px'}}>
                            <button className="tag-sort-btn" onClick={() => handleMoveTag(tag, 'up')} disabled={index === 0}>↑</button>
                            <button className="tag-sort-btn" onClick={() => handleMoveTag(tag, 'down')} disabled={index === tagsArray.length - 1}>↓</button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </>
              )}

              <div className="ios-group-title">目標モード {hasProgress && '(進捗を引き継いで変更)'}</div>
              <div className="ios-group">
                <div className="ios-row clickable" onClick={() => handleSelectMode('60')}>
                  <div style={{color: 'var(--success)'}}>{MODE_CONFIGS['60'].label}</div>
                  <div className="chevron-right">›</div>
                </div>
                <div className="ios-row clickable" onClick={() => handleSelectMode('80')}>
                  <div style={{color: 'var(--warning)'}}>{MODE_CONFIGS['80'].label}</div>
                  <div className="chevron-right">›</div>
                </div>
                <div className="ios-row clickable" onClick={() => handleSelectMode('100')}>
                  <div style={{color: 'var(--destructive)'}}>{MODE_CONFIGS['100'].label}</div>
                  <div className="chevron-right">›</div>
                </div>
              </div>

              {prog && (
                <>
                  <div className="ios-group-title">データ管理</div>
                  <div className="ios-group">
                    <div className="ios-row clickable" onClick={() => {
                      if (window.confirm('この単語帳の学習進捗（何%完了したか）をリセットし、未実施の状態に戻しますか？\n※単語帳のデータ自体は消えません。')) {
                        const newProgress = { ...allProgress };
                        delete newProgress[activeDeckId];
                        setAllProgress(newProgress);
                        syncToCloud(null, newProgress);
                        setView('library');
                      }
                    }}>
                      <div style={{color: 'var(--destructive)', fontWeight: 500}}>学習状況をリセット</div>
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>
        );
      }

      if (view === 'study') {
        const deck = decks.find(d => d.id === activeDeckId);
        const target = MODE_CONFIGS[studyMode].targetScore;
        const totalSessionPoints = initialTotal * target;
        const currentQueuePoints = queue.reduce((sum, q) => sum + Math.min(q.score || 0, target), 0);
        const completedSessionPoints = Math.max(0, initialTotal - queue.length) * target;
        const earnedSessionPoints = currentQueuePoints + completedSessionPoints;
        
        const progressPercent = totalSessionPoints > 0 ? Math.floor((earnedSessionPoints / totalSessionPoints) * 100) : 0;
        const equivalentRemaining = Math.max(0, Math.ceil((totalSessionPoints - earnedSessionPoints) / target));

        return (
          <div className="app-container">
            <StudyHeader 
              title={deck?.title}
              remainingCards={equivalentRemaining} 
              progressPercent={progressPercent}
              initialTimeLeft={timeLeft}
              onTimeUpdate={(t) => setTimeLeft(t)}
              onQuit={quitStudy}
            />
            <div className="content-area" style={{display: 'flex', flexDirection: 'column'}}>
              <div className="card-container" onClick={() => { if (queue.length > 0 && !isFlipped) setIsFlipped(true); }}>
                <div className={`card ${isFlipped ? 'flipped' : ''}`}>
                  <div className="card-face card-front">
                    <span className="card-label">Q.</span>
                    {queue[0]?.question}
                  </div>
                  <div className="card-face card-back">
                    <span className="card-label">A.</span>
                    {queue[0]?.answer}
                    <div className="score-badge">定着度 {Math.max(0, queue[0]?.score || 0)} / {MODE_CONFIGS[studyMode].targetScore}</div>
                  </div>
                </div>
              </div>
              
              <div className="controls">
                <button className="control-btn text-bad" onClick={() => handleJudge('bad')} disabled={!isFlipped}>
                  <span>全然ダメ</span>
                  <span style={{fontSize: '0.75rem', fontWeight: 400, opacity: 0.8}}>(←)</span>
                </button>
                <button className="control-btn text-soso" onClick={() => handleJudge('soso')} disabled={!isFlipped}>
                  <span>もう少し</span>
                  <span style={{fontSize: '0.75rem', fontWeight: 400, opacity: 0.8}}>(↓)</span>
                </button>
                <button className="control-btn text-perfect" onClick={() => handleJudge('perfect')} disabled={!isFlipped}>
                  <span>完璧</span>
                  <span style={{fontSize: '0.75rem', fontWeight: 400, opacity: 0.8}}>(→)</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (view === 'complete') {
        return (
          <div className="app-container" style={{alignItems: 'center', justifyContent: 'center', textAlign: 'center'}}>
            <h2 style={{fontSize: '2.5rem', marginBottom: '16px'}}>🎉 完了</h2>
            <p style={{color: 'var(--text-secondary)', marginBottom: '32px'}}>お疲れ様でした！</p>
            <div className="ios-group" style={{width: '200px'}}>
              <div className="ios-row clickable" style={{justifyContent: 'center'}} onClick={() => setView('library')}>
                <div style={{color: 'var(--accent-color)', fontWeight: 600}}>ライブラリへ戻る</div>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
